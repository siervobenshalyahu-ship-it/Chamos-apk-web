name: Retirar casos de ayuda vencidos
on:
  schedule:
    - cron: "10 5 * * *"   # todos los días, 1:10 a. m. hora de Venezuela
  workflow_dispatch:
permissions:
  contents: write
jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 ayuda/limpiar.py
      - name: Guardar cambios si hubo casos vencidos
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "Chamos"
            git config user.email "chamos@users.noreply.github.com"
            git add -A
            git commit -m "Retirar casos de ayuda vencidos"
            git push
          fi
